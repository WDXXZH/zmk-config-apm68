# RGB/WS2812 underglow
# NOTE: Zephyr's WS2812 GPIO bit-bang driver only supports Nordic nRF series
# (nRF51/52/53/91). STM32F103 is NOT supported. SPI mode requires the data
# line on SPI MOSI (PB14 is SPI2 MISO), so it can't be used without hardware
# modification. RGB underglow is disabled until a custom driver is available.
CONFIG_ZMK_RGB_UNDERGLOW=n

# EC11 编码器
CONFIG_SENSOR=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
