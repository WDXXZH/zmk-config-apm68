# RGB/WS2812 underglow
# 使用自定义 STM32 GPIO bit-bang 驱动(drivers/led_strip/ws2812_stm32.c)
# 数据脚: B14
CONFIG_ZMK_RGB_UNDERGLOW=y
# 灯带常供电,无 ext_power 控制引脚;ZMK 默认 y 会引用不存在的
# zmk_ext_power_generic DT 节点导致编译失败,必须显式关闭
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_LED_STRIP_WS2812_STM32=y

# EC11 编码器
CONFIG_SENSOR=y
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
